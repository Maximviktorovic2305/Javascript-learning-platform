name: Script Lab checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: script_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: script_lab_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U script_test -d script_lab_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://script_test:ci-only-password@127.0.0.1:5432/script_lab_test
      ALLOWED_ORIGIN: http://127.0.0.1:3020
      COOKIE_SECURE: 'false'
      EXECUTION_RUNNER: disabled
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm run install:all
      - run: npm --prefix backend audit --audit-level=low
      - run: npm --prefix frontend audit --audit-level=low
      - run: node scripts/build-curriculum.mjs
      - run: git diff --exit-code -- backend/src/catalog/data/lessons.json
      - run: npm run typecheck
      - run: npm --prefix backend run lint
      - run: npm test
      - run: bash -n deploy/build.sh deploy/release.sh
      - run: python3 -m unittest discover -s deploy/test
      - run: npm --prefix backend run db:migrate
      - run: npm --prefix backend run test:e2e -- --runInBand
      - run: npm run build
      - run: npm --prefix backend audit --omit=dev --audit-level=low
      - run: npm --prefix frontend/.output/server install --package-lock-only --ignore-scripts --no-audit
      - run: npm --prefix frontend/.output/server audit --omit=dev --audit-level=low
      - run: docker build -t script-lab-sandbox:1 runner/sandbox
      - run: docker build --pull -t script-lab-runner:ci runner
      - run: docker run --rm --entrypoint node script-lab-runner:ci --version
      - run: docker run --rm --entrypoint docker script-lab-runner:ci --version
      - run: npm --prefix runner/sandbox ci --ignore-scripts --no-audit
      - run: npm --prefix runner/sandbox audit --omit=dev --audit-level=low
      - run: node scripts/test-sandbox.mjs
      - name: Package the verified Linux runtime
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          printf '%s\n' "$DEPLOY_SHA" > deploy-sha.txt
          tar -czf "$RUNNER_TEMP/jslab-runtime.tar.gz" frontend/.output backend/dist deploy-sha.txt
          python3 deploy/validate-runtime.py "$RUNNER_TEMP/jslab-runtime.tar.gz" "$DEPLOY_SHA"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: jslab-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/jslab-runtime.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: Production
      url: https://js-lab.site
    concurrency:
      group: jslab-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: jslab-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/jslab-runtime
      - name: Build, back up, migrate and publish the verified commit
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$SSH_USERNAME" =~ ^[a-z_][a-z0-9_-]*$ ]]
          umask 077
          key="$RUNNER_TEMP/jslab-deploy-key"
          hosts="$RUNNER_TEMP/jslab-known-hosts"
          trap 'rm -f -- "$key" "$hosts"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts"
          archive="$RUNNER_TEMP/jslab-runtime/jslab-runtime.tar.gz"
          digest="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          options=(-i "$key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts"
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=6)
          ssh "${options[@]}" "$SSH_USERNAME@$SSH_HOST" 'mkdir -p /home/max/jslab/incoming'
          scp "${options[@]}" "$archive" "$SSH_USERNAME@$SSH_HOST:/home/max/jslab/incoming/$DEPLOY_SHA.tar.gz.partial"
          ssh "${options[@]}" "$SSH_USERNAME@$SSH_HOST" \
            "mv -- /home/max/jslab/incoming/$DEPLOY_SHA.tar.gz.partial /home/max/jslab/incoming/$DEPLOY_SHA.tar.gz"
          ssh "${options[@]}" "$SSH_USERNAME@$SSH_HOST" \
            "bash -s -- '$DEPLOY_SHA' '$digest'" < deploy/release.sh
