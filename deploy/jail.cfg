name: "jslab"
mode: ONCE
hostname: "jslab-sandbox"
cwd: "/tmp"
time_limit: 15
max_cpus: 1
log_level: ERROR
keep_env: false
envar: "PATH=/opt/jslab/node/bin:/usr/bin"
envar: "HOME=/tmp"
envar: "NODE_ENV=production"
keep_caps: false
disable_no_new_privs: false
rlimit_as_type: INF
rlimit_core: 0
rlimit_cpu: 10
rlimit_fsize: 8
rlimit_nofile: 128
rlimit_nproc: 64
rlimit_nproc_type: VALUE
clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true
mount_proc: false
uidmap { inside_id: "65534" outside_id: "65534" count: 1 }
gidmap { inside_id: "65534" outside_id: "65534" count: 1 }
mount { dst: "/" fstype: "tmpfs" options: "size=4m" rw: false nodev: true nosuid: true }
mount { src: "/usr" dst: "/usr" is_bind: true rw: false nosuid: true nodev: true }
mount { src: "/lib" dst: "/lib" is_bind: true rw: false nosuid: true nodev: true }
mount { src: "/lib64" dst: "/lib64" is_bind: true rw: false nosuid: true nodev: true }
mount { src: "/opt/jslab/node" dst: "/opt/jslab/node" is_bind: true rw: false nosuid: true nodev: true }
mount { src: "/opt/jslab/sandbox" dst: "/opt/app" is_bind: true rw: false nosuid: true nodev: true }
mount { dst: "/tmp" fstype: "tmpfs" options: "size=32m,mode=1777" rw: true noexec: true nodev: true nosuid: true }
mount { dst: "/proc" fstype: "proc" rw: false noexec: true nodev: true nosuid: true }
mount { src: "/dev/null" dst: "/dev/null" is_bind: true rw: true }
mount { src: "/dev/urandom" dst: "/dev/urandom" is_bind: true rw: false }
seccomp_string: "ERRNO(38) { clone3 } "
seccomp_string: "ERRNO(1) { mount, umount, pivot_root, unshare, setns, ptrace, bpf, perf_event_open, keyctl, add_key, request_key, userfaultfd, io_uring_setup, io_uring_enter, io_uring_register, kexec_load, reboot, init_module, finit_module, delete_module, open_by_handle_at, name_to_handle_at } "
seccomp_string: "ERRNO(1) { clone { (clone_flags & 0x7e020000) != 0 } } "
seccomp_string: "DEFAULT ALLOW"
